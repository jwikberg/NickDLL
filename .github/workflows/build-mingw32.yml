name: Build (mingw32)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mingw-w64

      - name: Configure
        run: cmake -DCMAKE_TOOLCHAIN_FILE=toolchain-clang-mingw32.cmake -DCMAKE_BUILD_TYPE=Release -B build .

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NickDLL
          path: build/NickDLL.dll
