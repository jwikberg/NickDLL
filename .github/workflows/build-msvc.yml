name: Build (MSVC)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build
        run: msbuild NickDLL.vcxproj /p:Configuration=Release /p:Platform=Win32 /m

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: NickDLL
          path: Release/NickDLL.dll
